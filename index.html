<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My One‑File GitHub Pages Site</title>

  <!-- ──────────────────────
       STYLE (CSS) – inline
       ────────────────────── -->
  <style>
    /* Basic reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: #fafafa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      background: #0066cc;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    nav a {
      color: #ffdd57;
      text-decoration: none;
      margin: 0 .5rem;
    }
    nav a:hover { text-decoration: underline; }

    main {
      flex: 1;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: #0066cc;
      color: #fff;
      border: none;
      padding: .6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #004e99; }
  </style>
</head>

<body>

  <!-- ──────────────────────
       HEADER
       ────────────────────── -->
  <header>
    <h1>🚀 My GitHub‑Pages One‑File Site</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- ──────────────────────
       MAIN CONTENT
       ────────────────────── -->
  <main>
    <section class="card">
      <h2>Hello, world!</h2>
      <p>This page lives completely inside a single <code>index.html</code> file.  
      The CSS is in a `<style>` block and the JavaScript is in a `<script>` block,
      so you don’t need any extra assets.</p>
      <button id="magicBtn">Click me!</button>
    </section>

    <section class="card">
      <h2>Why a single file?</h2>
      <ul>
        <li>Super‑easy to copy‑paste into a new repo.</li>
        <li>No extra folder structure to worry about.</li>
        <li>Great for quick demos, landing pages, or learning GitHub Pages.</li>
      </ul>
    </section>
  </main>

  <!-- ──────────────────────
       FOOTER
       ────────────────────── -->
  <footer>
    <p>© 2026 <a href="https://github.com/your‑username" style="color:#ffd700;">Your‑Name</a>. Built with ❤️ on GitHub Pages.</p>
  </footer>

  <!-- ──────────────────────
       SCRIPT (JS) – inline
       ────────────────────── -->
  <script>
    // Tiny demo: a fun click handler
    document.getElementById('magicBtn').addEventListener('click', () => {
      const emojis = ['🎉','🚀','✨','🤖','💡'];
      const emoji = emojis[Math.floor(Math.random()*emojis.length)];
      alert(`You got a ${emoji} – thanks for clicking!`);
    });

    // Log to the console so you know the site is running
    console.log('✅ Your GitHub Pages site is live.');
  </script>
</body>
</html>
