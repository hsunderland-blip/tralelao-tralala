<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE - Digital Tech Game Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Optional: Google Font for a bold look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="logo">🔥 FIRE</h1>
        <p class="tagline">Digital Tech Game Portal</p>
    </header>

    <main>
        <!-- Game Selection Tabs -->
        <nav class="game-tabs">
            <button class="tab active" onclick="showGame('snake')">Snake</button>
            <button class="tab" onclick="showGame('breakout')">Breakout</button>
        </nav>

        <!-- Snake Game Container -->
        <section id="snake-game" class="game-container active">
            <div class="game-wrapper">
                <canvas id="snakeCanvas" width="400" height="400"></canvas>
            </div>
            <div class="controls">
                <p>Score: <span id="snake-score">0</span></p>
                <p>High Score: <span id="snake-high-score">0</span></p>
                <button id="snake-start-btn" class="fire-btn">Start Game</button>
                <p class="instructions">Use Arrow Keys to Move</p>
            </div>
        </section>

        <!-- Breakout Game Container -->
        <section id="breakout-game" class="game-container">
            <div class="game-wrapper">
                <canvas id="breakoutCanvas" width="400" height="400"></canvas>
            </div>
            <div class="controls">
                <p>Score: <span id="breakout-score">0</span></p>
                <p>Lives: <span id="breakout-lives">3</span></p>
                <button id="breakout-start-btn" class="fire-btn">Start Game</button>
                <p class="instructions">Move Mouse/Touch to control Paddle</p>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 FIRE Portal. Built for Digital Technology. All games are open-source or public domain.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
